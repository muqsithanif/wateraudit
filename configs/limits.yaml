# Effluent discharge limits used by the compliance check.
#
# BOD, COD and SS follow the concentration limits in EU Directive 91/271/EEC,
# Annex I, Table 1 (plants above 10,000 population equivalent). The directive
# sets no pH limit; 6.5-8.5 is an assumed operating band. Edit this file for
# another jurisdiction.
standards:
  BOD:
    column: "DBO-S"
    limit_max: 25.0
    unit: "mg/L"
  COD:
    column: "DQO-S"
    limit_max: 125.0
    unit: "mg/L"
  SS:
    column: "SS-S"
    limit_max: 35.0
    unit: "mg/L"
  pH:
    column: "PH-S"
    limit_min: 6.5
    limit_max: 8.5
    unit: "pH units"

# Lower edge of each band on the risk index; below `watch` is GREEN.
alert_bands:
  watch: 0.20
  act: 0.50
  red: 0.80
